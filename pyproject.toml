[project]
name = "mmarank"
version = "0.1.0"
description = "Transparent, reproducible historical MMA ratings and rankings"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mmarank = "mmarank.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmarank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
